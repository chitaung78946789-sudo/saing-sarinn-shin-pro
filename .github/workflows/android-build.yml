name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract app source
        run: |
          mkdir -p app
          unzip -q saing-sarinn-shin-pro-v1.0.3.zip -d app
          echo "Extracted project files:"
          find app -maxdepth 3 -type f | sort | head -200
          test -f app/saing-sarinn-shin-pro/package.json

      - name: Install dependencies
        working-directory: app/saing-sarinn-shin-pro
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare Android project
        working-directory: app/saing-sarinn-shin-pro
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/saing-sarinn-shin-pro/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saing-sarinn-shin-pro-debug-apk
          path: app/saing-sarinn-shin-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
