name: Deploy AI Sales Dashboard and Shop Ledger
on:
  push:
    branches: [main]
    paths:
      - 'sales-agent/**'
      - 'products/mm-shop-ledger/**'
      - '.github/workflows/sales-agent-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/shop-ledger
          cp -R sales-agent/. _site/
          cp -R products/mm-shop-ledger/. _site/shop-ledger/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
