name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r sales-agent/backend/requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q sales-agent/backend
      - name: Validate agent configuration
        working-directory: sales-agent/backend
        run: |
          python -c "from agent_engine import AGENTS; assert len(AGENTS) == 6; print('6 agent roles verified')"
          python -c "import main; print('FastAPI backend import verified')"
