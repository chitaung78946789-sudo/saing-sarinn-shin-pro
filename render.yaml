services:
  - type: web
    name: saing-sarinn-shin-api
    runtime: docker
    plan: free
    rootDir: sales-agent/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OWNER_TOKEN
        sync: false
      - key: DB_PATH
        value: /tmp/sales_agent.db
      - key: ALLOWED_ORIGINS
        value: https://chitaung78946789-sudo.github.io
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
